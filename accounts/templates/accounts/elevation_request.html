{% extends "base_app.html" %}
{% load dashboard_navigation %}
{% block head_title %}Request Authorized Personnel – VeriMeet{% endblock %}
{% block content %}
<header class="vm-page-header"><h1>Request Authorized Personnel</h1></header>
  <div>
    <section class="card">
      <form method="post">{% csrf_token %}{% dashboard_field %}
        {{ form.as_p }}
        <button type="submit">Submit Request</button>
      </form>
      <p><a href="{% dashboard_url 'department_dashboard' dept_id=department.id %}">← Back to Dashboard</a></p>
    </section>
  </div>
{% endblock %}
