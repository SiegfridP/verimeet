{% load dashboard_navigation %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Authorized Personnel – VeriMeet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {margin:0;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0d0d2b,#1a1a40);color:#e0e0ff;min-height:100vh;display:flex;flex-direction:column;}
    header{background:rgba(255,255,255,0.1);padding:1rem 2rem;backdrop-filter:blur(5px);}
    main{flex:1;padding:2rem;}
    .card{background:rgba(255,255,255,0.08);border-radius:8px;padding:1.5rem;margin-top:1rem;backdrop-filter:blur(4px);}
    textarea, input{width:100%;padding:0.5rem;margin-top:0.5rem;border:none;border-radius:4px;background:rgba(255,255,255,0.12);color:#e0e0ff;}
    button{background:#4fd1c5;color:#1a1a40;padding:0.5rem 1rem;border:none;border-radius:4px;margin-top:0.5rem;cursor:pointer;transition:background .2s;}
    button:hover{background:#81e6d9;}
    a{color:#4fd1c5;text-decoration:none;}
  </style>
</head>
<body>
  <header><h1>Request Authorized Personnel</h1></header>
  <main>
    <section class="card">
      <form method="post">{% csrf_token %}{% dashboard_field %}
        {{ form.as_p }}
        <button type="submit">Submit Request</button>
      </form>
      <p><a href="{% dashboard_url 'department_dashboard' dept_id=department.id %}">← Back to Dashboard</a></p>
    </section>
  </main>
</body>
</html>
